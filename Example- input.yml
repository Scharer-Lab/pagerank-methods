######steps to consider before running this ############

# Use sorted bam file for ATAC-seq data
# Use gene counts in tsv format for RNA-seq data
# The tsv gene counts files should not have headers (e.g. SYMBOL and group name)
# If you get a 'RNA average failed error' means the program has difficulty reading your tsv files. Remake your files in shell.



################################################################################
# *Important*: Proper identation of the text is critical for parsing!
# Lines starting with a '#' character are comments, for human reading only.
# Further read about the YAML format: http://www.yaml.org/start.html.
################################################################################

# NOTE: Each experiment must have a *UNIQUE* ID.
# Related experiments must share the same group name.
# For example, you want to use "spleen" as the group name for
# "spleen_ATAC_Seq", "spleen_RNA_Seq", etc.

ATAC-Seq:
  - id: spleen_ATAC
    group: spleen
    replicates:
      - rep: 1
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/1.SP/sorted_1.SP.bam
      - rep: 2
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/2.SP/sorted_2.SP.bam
      - rep: 3
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/3.SP/sorted_3.SP.bam
      - rep: 4
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/4.SP/sorted_4.SP.bam
      - rep: 5
