      - rep: 6
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/6.SP/sorted_6.SP.bam

  - id: bal_ATAC
    group: bal
    replicates:
      - rep: 1
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/2.BAL/sorted_2.BAL.bam
      - rep: 2
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/3.BAL/sorted_3.BAL.bam
      - rep: 3
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/4.BAL/sorted_4.BAL.bam
      - rep: 4
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/6.BAL/sorted_6.BAL.bam
    
  - id: lung_ATAC
    group: lung
    replicates:
      - rep: 1
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/3.Lung/sorted_3.Lung.bam
      - rep: 2
        files:
          - path: /Volumes/ESB/LRRK2_MJFF/KHOL_LRRK2_01/ATAC_20160801_01/2016.8.LRRK2.Wt.CD8.Flu/data/4.Lung/sorted_4.Lung.bam
      - rep: 3
