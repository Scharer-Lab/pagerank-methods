# NOTE: Each experiment must have a *UNIQUE* ID.
# Related experiments must share the same group name.
# For example, you want to use "spleen" as the group name for
# "spleen_ATAC_Seq", "spleen_RNA_Seq", etc.

ATAC-Seq:
  - id: Nav_IgM_ATAC
    group: Nav_IgM
    replicates:
      - rep: 1
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Nav_1/Nav_1.sort.dupMark.bam
            tags: ["filtered"]
      - rep: 2
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Nav_2/Nav_2.sort.dupMark.bam
            tags: ["filtered"]
      - rep: 3
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Nav_3/Nav_3.sort.dupMark.bam
            tags: ["filtered"]

  - id: Mem_IgM_ATAC
    group: Mem_IgM
    replicates:
      - rep: 1
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Mem_IgM_1/Mem_IgM_1.sort.dupMark.bam
            tags: ["filtered"]
      - rep: 2
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Mem_IgM_2/Mem_IgM_2.sort.dupMark.bam
            tags: ["filtered"]
      - rep: 3
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Mem_IgM_3/Mem_IgM_3.sort.dupMark.bam
            tags: ["filtered"]

  - id: Mem_IgG_ATAC
    group: Mem_IgG
    replicates:
      - rep: 1
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Mem_IgG_1/Mem_IgG_1.sort.dupMark.bam
            tags: ["filtered"]
      - rep: 2
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/data/Mem_IgG_2/Mem_IgG_2.sort.dupMark.bam
            tags: ["filtered"]

RNA-Seq:
  - id: Nav_IgM_RNA
    group: Nav_IgM
    replicates:
      - rep: 1
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Nav_IgM_1.rpkm.tsv
            tags: ["gene quantification"]
      - rep: 2
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Nav_IgM_2.rpkm.tsv
            tags: ["gene quantification"]
      - rep: 3
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Nav_IgM_3.rpkm.tsv
            tags: ["gene quantification"]

  - id: Mem_IgM_RNA
    group: Mem_IgM
    replicates:
      - rep: 1
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Mem_IgM_1.rpkm.tsv
            tags: ["gene quantification"]
      - rep: 2
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Mem_IgM_2.rpkm.tsv
            tags: ["gene quantification"]
      - rep: 3
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Mem_IgM_3.rpkm.tsv
            tags: ["gene quantification"]

  - id: Mem_IgG_RNA
    group: Mem_IgG
    replicates:
      - rep: 1
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Mem_IgG_2.rpkm.tsv
            tags: ["gene quantification"]
      - rep: 2
        files:
          - path: /Volumes/GRAID/Memory.Bcell.ATAC/analysis/PageRank/rna/Mem_IgG_3.rpkm.tsv
            tags: ["gene quantification"]

